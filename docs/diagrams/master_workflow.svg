<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .zone-bg { fill: #1e293b; fill-opacity: 0.6; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 12px; }
      .zone-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.12em; }
      
      .node-box { fill: #1e293b; stroke: #475569; stroke-width: 1.2; rx: 8px; }
      .node-focal { fill: rgba(56, 189, 248, 0.12); stroke: #38bdf8; stroke-width: 1.8; rx: 8px; }
      .node-accent2 { fill: rgba(249, 115, 22, 0.12); stroke: #f97316; stroke-width: 1.6; rx: 8px; }
      .node-subtle { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6px; }
      
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #f8fafc; }
      .title-focal { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #38bdf8; }
      .sub-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #94a3b8; }
      
      .conn-line { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-linejoin: round; }
      .conn-focal { fill: none; stroke: #38bdf8; stroke-width: 1.6; stroke-linejoin: round; }
      .conn-dash { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 3; stroke-linejoin: round; }
      
      .lbl-bg { fill: #0f172a; rx: 4px; }
      .lbl-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; fill: #cbd5e1; }
      .hdr-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.01em; }
      .hdr-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38bdf8; font-weight: 500; }
    </style>

    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrow-focal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#f97316" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" class="bg" rx="14px"/>

  <!-- Top Header Title -->
  <g transform="translate(36, 32)">
    <text class="hdr-sub" y="0">SYSTEM ARCHITECTURE · PIPELINE OVERVIEW</text>
    <text class="hdr-main" y="22">Mobile Downloader Browser — Master Application Workflow</text>
  </g>

  <!-- 1. LAUNCH & BOOTSTRAP ZONE -->
  <g transform="translate(36, 75)">
    <rect width="230" height="620" class="zone-bg" />
    <text x="16" y="24" class="zone-title">1. Bootstrapping &amp; Auth</text>
    
    <!-- Node: main() -->
    <g transform="translate(16, 40)">
      <rect width="198" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">App Start main()</text>
      <text x="12" y="38" class="sub-text">Native JNI &amp; Edge-to-Edge</text>
    </g>

    <!-- Node: Storage & DB -->
    <g transform="translate(16, 120)">
      <rect width="198" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">Preferences &amp; State</text>
      <text x="12" y="38" class="sub-text">Hive / SharedPreferences</text>
    </g>

    <!-- Node: Entitlement Tier -->
    <g transform="translate(16, 200)">
      <rect width="198" height="64" class="node-accent2" />
      <text x="12" y="22" class="title-text" fill="#fdba74">Tier Entitlement Store</text>
      <text x="12" y="38" class="sub-text">Play Billing · Server Verify</text>
      <text x="12" y="52" class="sub-text" fill="#fb923c">Free · Pro · Ultra</text>
    </g>

    <!-- Node: First Launch Tour -->
    <g transform="translate(16, 290)">
      <rect width="198" height="54" class="node-subtle" />
      <text x="12" y="22" class="title-text">First Launch Check</text>
      <text x="12" y="38" class="sub-text">Interactive Tour / Perms</text>
    </g>

    <!-- Node: Shell Init -->
    <g transform="translate(16, 370)">
      <rect width="198" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">System Background</text>
      <text x="12" y="38" class="sub-text">Timers · Watcher · Auto-Backup</text>
    </g>

    <!-- Connections in Zone 1 -->
    <path d="M 115 94 V 118" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 115 174 V 198" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 115 264 V 288" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 115 344 V 368" class="conn-line" marker-end="url(#arrow)"/>
  </g>

  <!-- Connector Zone 1 -> Zone 2 -->
  <path d="M 250 472 H 280 Q 288 472 288 464 V 140 Q 288 132 296 132 H 304" class="conn-line" marker-end="url(#arrow)"/>

  <!-- 2. CORE SHELL & ROUTING ZONE -->
  <g transform="translate(304, 75)">
    <rect width="230" height="620" class="zone-bg" />
    <text x="16" y="24" class="zone-title">2. Navigation &amp; Shell</text>

    <!-- Node: AuroraDock -->
    <g transform="translate(16, 40)">
      <rect width="198" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">AuroraDock Shell</text>
      <text x="12" y="38" class="sub-text">Floating Glass Controller</text>
    </g>

    <!-- Node: Tab 1 Queue -->
    <g transform="translate(16, 120)">
      <rect width="198" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">Queue Page (Tab 1)</text>
      <text x="12" y="38" class="sub-text">Active · Completed · Batch</text>
    </g>

    <!-- Node: Tab 2 Browser -->
    <g transform="translate(16, 200)">
      <rect width="198" height="54" class="node-focal" />
      <text x="12" y="22" class="title-focal">Sniffer Browser (Tab 2)</text>
      <text x="12" y="38" class="sub-text" fill="#7dd3fc">Multi-tab · Stealth UA</text>
    </g>

    <!-- Node: Tools Hub -->
    <g transform="translate(16, 290)">
      <rect width="198" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">Tool &amp; Utility Hub</text>
      <text x="12" y="38" class="sub-text">FFmpeg · Vault · Watcher</text>
    </g>

    <!-- Node: Settings & Automation -->
    <g transform="translate(16, 370)">
      <rect width="198" height="54" class="node-subtle" />
      <text x="12" y="22" class="title-text">Settings &amp; Automation</text>
      <text x="12" y="38" class="sub-text">Local HTTP Automation API</text>
    </g>

    <!-- Connections in Zone 2 -->
    <path d="M 115 94 V 118" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 115 174 V 198" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 115 254 V 288" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 115 344 V 368" class="conn-line" marker-end="url(#arrow)"/>
  </g>

  <!-- Connector Zone 2 -> Zone 3 -->
  <path d="M 518 302 H 572" class="conn-focal" marker-end="url(#arrow-focal)"/>

  <!-- 3. BROWSING & SNIFFER ENGINE -->
  <g transform="translate(572, 75)">
    <rect width="230" height="280" class="zone-bg" />
    <text x="16" y="24" class="zone-title">3. Media Sniffing Engine</text>

    <!-- Node: WebView & AdBlock -->
    <g transform="translate(16, 40)">
      <rect width="198" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">InAppWebView Engine</text>
      <text x="12" y="38" class="sub-text">Rust C++ Adblock Trie Intercept</text>
    </g>

    <!-- Node: Media Capture Analyzer -->
    <g transform="translate(16, 120)">
      <rect width="198" height="54" class="node-focal" />
      <text x="12" y="22" class="title-focal">Media Sniffer Analyzer</text>
      <text x="12" y="38" class="sub-text" fill="#7dd3fc">DOM Hook · XHR/Fetch · HLS</text>
    </g>

    <!-- Node: Sniffer Badge & Tray -->
    <g transform="translate(16, 200)">
      <rect width="198" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">Floating Sniffer Tray</text>
      <text x="12" y="38" class="sub-text">Stream Selector · Format Pick</text>
    </g>

    <!-- Connections in Zone 3 -->
    <path d="M 115 94 V 118" class="conn-focal" marker-end="url(#arrow-focal)"/>
    <path d="M 115 174 V 198" class="conn-focal" marker-end="url(#arrow-focal)"/>
  </g>

  <!-- 4. MULTI-PROTOCOL DOWNLOAD ENGINE -->
  <g transform="translate(572, 380)">
    <rect width="230" height="315" class="zone-bg" />
    <text x="16" y="24" class="zone-title">4. Multi-Protocol Engine</text>

    <!-- Node: Queue Dispatcher -->
    <g transform="translate(16, 40)">
      <rect width="198" height="54" class="node-focal" />
      <text x="12" y="22" class="title-focal">Task Dispatcher</text>
      <text x="12" y="38" class="sub-text" fill="#7dd3fc">Protocol Classifier &amp; Isolates</text>
    </g>

    <!-- Protocols grid/list -->
    <g transform="translate(16, 115)">
      <rect width="198" height="96" class="node-box" />
      <text x="10" y="20" class="sub-text" fill="#38bdf8">▪ HTTP</text>
      <text x="56" y="20" class="sub-text">Segmented Range Chunks</text>
      <text x="10" y="42" class="sub-text" fill="#38bdf8">▪ HLS</text>
      <text x="56" y="42" class="sub-text">.ts Download + AES-128</text>
      <text x="10" y="64" class="sub-text" fill="#38bdf8">▪ DASH</text>
      <text x="56" y="64" class="sub-text">.mpd Multi-track Muxing</text>
      <text x="10" y="86" class="sub-text" fill="#38bdf8">▪ TORRENT</text>
      <text x="56" y="86" class="sub-text">Native libtorrent Swarm</text>
    </g>

    <!-- Combiner & Revival -->
    <g transform="translate(16, 230)">
      <rect width="198" height="60" class="node-box" />
      <text x="12" y="22" class="title-text">File Combiner &amp; Limiter</text>
      <text x="12" y="38" class="sub-text">Dead-Link Revival Service</text>
      <text x="12" y="50" class="sub-text" fill="#fdba74">Auto-Recovery on 403 Expiry</text>
    </g>

    <!-- Connections in Zone 4 -->
    <path d="M 115 94 V 113" class="conn-focal" marker-end="url(#arrow-focal)"/>
    <path d="M 115 211 V 228" class="conn-focal" marker-end="url(#arrow-focal)"/>
  </g>

  <!-- Connect Zone 3 -> Zone 4 -->
  <path d="M 687 329 V 418" class="conn-focal" marker-end="url(#arrow-focal)"/>

  <!-- 5. MEDIA TOOLS & SECURE VAULT -->
  <g transform="translate(840, 75)">
    <rect width="244" height="620" class="zone-bg" />
    <text x="16" y="24" class="zone-title">5. Tools, Storage &amp; Vault</text>

    <!-- Node: Completion Router -->
    <g transform="translate(16, 40)">
      <rect width="212" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">Download Completion</text>
      <text x="12" y="38" class="sub-text">Rich Action Notifications</text>
    </g>

    <!-- Node: Android MediaStore -->
    <g transform="translate(16, 120)">
      <rect width="212" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">MediaStore Integration</text>
      <text x="12" y="38" class="sub-text">SAF Public / Download Storage</text>
    </g>

    <!-- Node: Encrypted Vault -->
    <g transform="translate(16, 200)">
      <rect width="212" height="64" class="node-accent2" />
      <text x="12" y="22" class="title-text" fill="#fdba74">Private Vault (AES-256)</text>
      <text x="12" y="38" class="sub-text">Biometric Lock · Camouflage</text>
      <text x="12" y="52" class="sub-text" fill="#fed7aa">Hidden from Media Gallery</text>
    </g>

    <!-- Node: FFmpeg Studio -->
    <g transform="translate(16, 290)">
      <rect width="212" height="64" class="node-box" />
      <text x="12" y="22" class="title-text">FFmpeg Studio Suite</text>
      <text x="12" y="38" class="sub-text">On-Demand Dynamic Module</text>
      <text x="12" y="52" class="sub-text">Transcode · Trim · Audio Extract</text>
    </g>

    <!-- Node: LAN Sharing -->
    <g transform="translate(16, 380)">
      <rect width="212" height="54" class="node-subtle" />
      <text x="12" y="22" class="title-text">LAN File Server</text>
      <text x="12" y="38" class="sub-text">Send to PC · QR Wi-Fi Sharing</text>
    </g>

    <!-- Node: In-App Player -->
    <g transform="translate(16, 460)">
      <rect width="212" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">Nordic Video Player</text>
      <text x="12" y="38" class="sub-text">Hardware Decoded · Subtitles</text>
    </g>

    <!-- Connections in Zone 5 -->
    <path d="M 122 94 V 118" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 122 174 V 198" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 122 264 V 288" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 122 354 V 378" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 122 434 V 458" class="conn-line" marker-end="url(#arrow)"/>
  </g>

  <!-- Connect Zone 4 -> Zone 5 -->
  <path d="M 786 640 H 814 Q 822 640 822 632 V 140 Q 822 132 830 132 H 838" class="conn-focal" marker-end="url(#arrow-focal)"/>

</svg>
