<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .zone-bg { fill: #1e293b; fill-opacity: 0.6; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 12px; }
      .zone-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.12em; }
      
      .node-box { fill: #1e293b; stroke: #475569; stroke-width: 1.2; rx: 8px; }
      .node-focal { fill: rgba(56, 189, 248, 0.12); stroke: #38bdf8; stroke-width: 1.8; rx: 8px; }
      .node-accent2 { fill: rgba(249, 115, 22, 0.12); stroke: #f97316; stroke-width: 1.6; rx: 8px; }
      .node-accent-green { fill: rgba(34, 197, 94, 0.12); stroke: #22c55e; stroke-width: 1.5; rx: 8px; }
      
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #f8fafc; }
      .title-focal { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #38bdf8; }
      .sub-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #94a3b8; }
      
      .conn-line { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-linejoin: round; }
      .conn-focal { fill: none; stroke: #38bdf8; stroke-width: 1.6; stroke-linejoin: round; }
      .conn-green { fill: none; stroke: #22c55e; stroke-width: 1.5; stroke-linejoin: round; }
      .conn-revival { fill: none; stroke: #f97316; stroke-width: 1.6; stroke-dasharray: 5 3; stroke-linejoin: round; }
      
      .hdr-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.01em; }
      .hdr-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38bdf8; font-weight: 500; }
    </style>

    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrow-focal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#22c55e" />
    </marker>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#f97316" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="14px"/>

  <!-- Top Header Title -->
  <g transform="translate(36, 32)">
    <text class="hdr-sub" y="0">CORE ENGINE &amp; PROTOCOL ORCHESTRATION</text>
    <text class="hdr-main" y="22">Multi-Protocol Download Engine Lifecycle &amp; Recovery</text>
  </g>

  <!-- ZONE 1: Task Intake & Classification -->
  <g transform="translate(36, 75)">
    <rect width="240" height="645" class="zone-bg" />
    <text x="16" y="24" class="zone-title">1. Queue &amp; Dispatch</text>

    <g transform="translate(16, 44)">
      <rect width="208" height="60" class="node-focal" />
      <text x="12" y="22" class="title-focal">DownloadQueue.enqueue()</text>
      <text x="12" y="40" class="sub-text">Task Registration &amp; Priority</text>
      <text x="12" y="52" class="sub-text" fill="#7dd3fc">Isolation Worker Pool</text>
    </g>

    <g transform="translate(16, 130)">
      <rect width="208" height="64" class="node-box" />
      <text x="12" y="22" class="title-text">Protocol Router</text>
      <text x="12" y="40" class="sub-text">Header Sniffing &amp; Magic Bytes</text>
      <text x="12" y="52" class="sub-text">MIME Type &amp; Extension Match</text>
    </g>

    <g transform="translate(16, 220)">
      <rect width="208" height="150" class="node-box" />
      <text x="12" y="22" class="title-text">Protocol Targets</text>
      <text x="12" y="44" class="sub-text" fill="#38bdf8">1. Direct HTTP/HTTPS</text>
      <text x="12" y="60" class="sub-text" fill="#94a3b8">   Multi-chunk Byte Ranges</text>
      <text x="12" y="78" class="sub-text" fill="#38bdf8">2. HLS (.m3u8)</text>
      <text x="12" y="94" class="sub-text" fill="#94a3b8">   Playlist + AES-128 TS</text>
      <text x="12" y="112" class="sub-text" fill="#38bdf8">3. DASH (.mpd)</text>
      <text x="12" y="128" class="sub-text" fill="#94a3b8">   Media Presentation XML</text>
      <text x="12" y="144" class="sub-text" fill="#38bdf8">4. Torrent / Magnet</text>
    </g>

    <g transform="translate(16, 396)">
      <rect width="208" height="74" class="node-accent2" />
      <text x="12" y="22" class="title-text" fill="#fdba74">Dead-Link Revival Target</text>
      <text x="12" y="40" class="sub-text">Incoming re-sniffed cookies</text>
      <text x="12" y="54" class="sub-text">Resume broken tasks</text>
      <text x="12" y="66" class="sub-text" fill="#fed7aa">No progress loss</text>
    </g>

    <path d="M 120 104 V 128" class="conn-focal" marker-end="url(#arrow-focal)"/>
    <path d="M 120 194 V 218" class="conn-line" marker-end="url(#arrow)"/>
  </g>

  <!-- Connect Zone 1 -> Zone 2 -->
  <path d="M 276 345 H 316" class="conn-focal" marker-end="url(#arrow-focal)"/>

  <!-- ZONE 2: Protocol Handlers & Execution -->
  <g transform="translate(316, 75)">
    <rect width="450" height="645" class="zone-bg" />
    <text x="16" y="24" class="zone-title">2. Specialized Protocol Handlers</text>

    <!-- Block A: Direct HTTP Segmented Engine -->
    <g transform="translate(16, 40)">
      <rect width="418" height="124" class="node-box" />
      <text x="14" y="22" class="title-text" fill="#38bdf8">Direct HTTP Segmented Engine</text>
      <text x="14" y="40" class="sub-text">▪ Range Header Detection: Head request probes 'bytes' support</text>
      <text x="14" y="56" class="sub-text">▪ DownloadSplitter: Splits file into N balanced concurrent byte ranges</text>
      <text x="14" y="72" class="sub-text">▪ Worker Threads: Concurrent HTTP GET requests with custom User-Agent</text>
      <text x="14" y="88" class="sub-text">▪ SpeedLimiter &amp; FileCombiner: Stitches temp chunk parts into final file</text>
      <text x="14" y="106" class="sub-text" fill="#7dd3fc">Single-thread fallback if server lacks Range support</text>
    </g>

    <!-- Block B: HLS Stream Downloader -->
    <g transform="translate(16, 180)">
      <rect width="418" height="124" class="node-box" />
      <text x="14" y="22" class="title-text" fill="#38bdf8">HLS Stream Downloader (.m3u8)</text>
      <text x="14" y="40" class="sub-text">▪ Master &amp; Media Playlist Parser: Extracts resolution, bitrate, audio tracks</text>
      <text x="14" y="56" class="sub-text">▪ HlsDecryptor: Resolves #EXT-X-KEY URI, fetches AES-128 key &amp; IV vector</text>
      <text x="14" y="72" class="sub-text">▪ Parallel TS Downloader: High-throughput chunk streaming with retry queue</text>
      <text x="14" y="88" class="sub-text">▪ Native Remuxing: In-memory AES decrypt &amp; MediaMuxer transcode to MP4</text>
      <text x="14" y="106" class="sub-text" fill="#7dd3fc">Eliminates out-of-order corruption and video sync drift</text>
    </g>

    <!-- Block C: DASH Stream Downloader -->
    <g transform="translate(16, 320)">
      <rect width="418" height="110" class="node-box" />
      <text x="14" y="22" class="title-text" fill="#38bdf8">DASH Stream Downloader (.mpd)</text>
      <text x="14" y="40" class="sub-text">▪ MPD XML Representation Extractor: Selects optimal video &amp; audio streams</text>
      <text x="14" y="56" class="sub-text">▪ Initialization &amp; Media Segments: Sequential fetch of init.mp4 and chunks</text>
      <text x="14" y="72" class="sub-text">▪ Dual-Stream Multiplexing: Synchronizes separate audio/video feeds into MP4</text>
      <text x="14" y="90" class="sub-text" fill="#7dd3fc">Integrated native header and cookie pass-through</text>
    </g>

    <!-- Block D: BitTorrent Engine -->
    <g transform="translate(16, 446)">
      <rect width="418" height="110" class="node-box" />
      <text x="14" y="22" class="title-text" fill="#38bdf8">Native BitTorrent Engine (16 KB Aligned)</text>
      <text x="14" y="40" class="sub-text">▪ Magnet Link &amp; .torrent Bencode Parser: Extracts info_hash &amp; tracker URLs</text>
      <text x="14" y="56" class="sub-text">▪ DHT &amp; Peer Swarm: High-performance C++ libtorrent connection bindings</text>
      <text x="14" y="72" class="sub-text">▪ Piece Verification: SHA-1 piece hash checks &amp; sequential write to storage</text>
      <text x="14" y="90" class="sub-text" fill="#7dd3fc">Prebuilt JNI libraries aligned for Android 16 KB page-size compliance</text>
    </g>

    <!-- Block E: Speed Limiter & Combiner Hub -->
    <g transform="translate(16, 572)">
      <rect width="418" height="56" class="node-focal" />
      <text x="14" y="22" class="title-focal">File Combiner &amp; Rate Limiter</text>
      <text x="14" y="40" class="sub-text">Zero-Copy IO · SHA-256 Integrity Verification · Progress Broadcast</text>
    </g>

    <!-- Connections in Zone 2 to Combiner -->
    <path d="M 225 164 V 178" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 225 304 V 318" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 225 430 V 444" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 225 556 V 570" class="conn-focal" marker-end="url(#arrow-focal)"/>
  </g>

  <!-- Connect Zone 2 -> Zone 3 -->
  <path d="M 766 600 H 806" class="conn-focal" marker-end="url(#arrow-focal)"/>

  <!-- ZONE 3: State Monitor, Dead-Link Revival & Completion -->
  <g transform="translate(806, 75)">
    <rect width="298" height="645" class="zone-bg" />
    <text x="16" y="24" class="zone-title">3. State &amp; Revival Loop</text>

    <!-- Node: Progress Stream -->
    <g transform="translate(16, 40)">
      <rect width="266" height="56" class="node-box" />
      <text x="12" y="22" class="title-text">Download Progress Stream</text>
      <text x="12" y="40" class="sub-text">Speed Meter, ETA, Bytes &amp; UI Notification</text>
    </g>

    <!-- Node: Result Classifier -->
    <g transform="translate(16, 120)">
      <rect width="266" height="56" class="node-box" />
      <text x="12" y="22" class="title-text">Execution State Classifier</text>
      <text x="12" y="40" class="sub-text">Detects Paused · Completed · 403 Expiry</text>
    </g>

    <!-- Node: Completed -->
    <g transform="translate(16, 200)">
      <rect width="266" height="66" class="node-accent-green" />
      <text x="12" y="22" class="title-text" fill="#4ade80">State: COMPLETED</text>
      <text x="12" y="38" class="sub-text">Android MediaStore Index Scan</text>
      <text x="12" y="52" class="sub-text" fill="#86efac">Post Rich Notification with Action Buttons</text>
    </g>

    <!-- Node: Paused -->
    <g transform="translate(16, 290)">
      <rect width="266" height="54" class="node-box" />
      <text x="12" y="22" class="title-text">State: PAUSED</text>
      <text x="12" y="40" class="sub-text">Persist Byte Checkpoints &amp; Chunk Map</text>
    </g>

    <!-- Node: Dead Link Revival Engine -->
    <g transform="translate(16, 370)">
      <rect width="266" height="120" class="node-accent2" />
      <text x="12" y="22" class="title-text" fill="#fdba74">Dead-Link Revival Service</text>
      <text x="12" y="40" class="sub-text">▪ Trigger: HTTP 403 / 410 / Signed URL Expiry</text>
      <text x="12" y="56" class="sub-text">▪ Headless Resniffer: Background WebView</text>
      <text x="12" y="72" class="sub-text">▪ Token Refresh: Re-sniffs live CDN cookie</text>
      <text x="12" y="88" class="sub-text">▪ In-Place URL Patch: Updates chunk headers</text>
      <text x="12" y="106" class="sub-text" fill="#fed7aa">Resumes exact download without restarting</text>
    </g>

    <!-- Connections in Zone 3 -->
    <path d="M 149 96 V 118" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 149 176 V 198" class="conn-green" marker-end="url(#arrow-green)"/>
    <path d="M 149 266 V 288" class="conn-line" marker-end="url(#arrow)"/>
    <path d="M 149 344 V 368" class="conn-revival" marker-end="url(#arrow-orange)"/>
  </g>

  <!-- Dead Link Revival Return Loop (Zone 3 -> Zone 1) -->
  <path d="M 806 435 H 230" class="conn-revival" marker-end="url(#arrow-orange)"/>

</svg>
