name: media_kit_libs_android_video
description: Android package providing video (& audio) native libraries for package:media_kit.
version: 1.3.8
homepage: https://github.com/media-kit/media-kit.git
repository: https://github.com/media-kit/media-kit.git

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      # NOTE (aurora fork): pluginClass intentionally omitted for Android.
      # Keeps MediaKitAndroidHelper/MediaKitLibsAndroidVideoPlugin classes in the
      # base module but prevents eager registration, so System.loadLibrary("mpv")
      # and loadLibrary("mediakitandroidhelper") never run at launch.
      # `ffiPlugin: true` satisfies Flutter's plugin validation without a
      # registrant entry. Registered at runtime via
      # flutterEngine.getPlugins().add(...) AFTER the on-demand :mediakit module
      # is installed (see MainActivity.registerPlugin).
      android:
        package: com.alexmercerind.media_kit_libs_android_video
        ffiPlugin: true
