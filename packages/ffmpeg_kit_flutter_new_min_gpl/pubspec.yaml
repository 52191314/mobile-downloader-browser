name: ffmpeg_kit_flutter_new_min_gpl
description: FFmpeg Kit Min-GPL for Flutter. Supports Android, iOS, macOS and Windows platforms.
repository: https://github.com/sk3llo/ffmpeg_kit_flutter
homepage: https://github.com/sk3llo/ffmpeg_kit_flutter
version: 2.5.3
environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    platforms:
      # NOTE (aurora fork): pluginClass intentionally omitted for Android.
      # Keeps the Java classes + ffmpeg-kit AAR in the base module but prevents
      # eager registration, so FFmpegKitConfig's static System.loadLibrary(...)
      # never runs at launch. `ffiPlugin: true` satisfies Flutter's plugin
      # validation without a registrant entry. The plugin is registered at
      # runtime via flutterEngine.getPlugins().add(...) AFTER the on-demand
      # :ffmpeg module is installed (see MainActivity.registerPlugin).
      android:
        package: com.antonkarpenko.ffmpegkit
        ffiPlugin: true
      ios:
        pluginClass: FFmpegKitFlutterPlugin
      macos:
        pluginClass: FFmpegKitFlutterPlugin
      windows:
        pluginClass: FFmpegKitFlutterPlugin

dependencies:
  ffmpeg_kit_flutter_platform_interface: ^0.2.1

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
