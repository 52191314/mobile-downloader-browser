# Heap must leave room for the OS on this machine (7.8 GB physical). A 6144M
# heap could never actually be committed here: the daemon grew into swap and
# was OOM-killed mid-build, which looked like random Gradle failures. Kotlin
# compiles in-process (below), so this heap covers the compiler too.
# Raise only if dexing actually OOMs, and only alongside more physical RAM.
org.gradle.jvmargs=-Xmx3584M -XX:MaxMetaspaceSize=768M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Incremental Kotlin compilation: only recompile changed .kt files instead of
# the whole module on every edit (was false). Safe with in-process execution.
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
# NOTE: org.gradle.parallel and org.gradle.caching are deliberately NOT enabled —
# this machine has 7.8 GB physical RAM and a documented OOM history (see jvmargs
# comment above); parallel workers raise peak memory, and the build cache can
# serve stale feature-module metadata when switching between play/github build
# channels. Keep the known-good config.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Build channel: "play" or "github" (default).
# Play builds use dynamic feature modules for on-demand FFmpeg delivery.
# GitHub builds produce a fat APK with everything included.
# Override in CI with: -PauroraBuildChannel=play
auroraBuildChannel=github
